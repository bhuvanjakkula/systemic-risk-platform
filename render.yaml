services:
  - type: web
    name: systemic-risk-platform
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SRP_AUTH_DB
        value: /var/data/accounts.sqlite3
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
